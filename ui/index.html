<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AgentForge 画布（原型）</title>
<link rel="stylesheet" href="/ui/canvas.css">
</head>
<body>
<header id="bar">
  <strong>AgentForge 画布</strong>
  <span id="banner" class="banner" hidden></span>
  <span class="spacer"></span>
  <input type="file" id="open-file" accept=".yaml,.yml" hidden>
  <button id="btn-open" type="button">打开 YAML</button>
  <select id="sample" aria-label="样例流程"></select>
  <button id="btn-export" type="button">导出 YAML</button>
  <button id="btn-validate" type="button">校验</button>
  <button id="btn-zoom-out" type="button" title="缩小">−</button>
  <button id="btn-zoom-in" type="button" title="放大">+</button>
</header>
<main>
  <aside id="palette">
    <h2>块库</h2>
    <ul id="blocks"></ul>
    <p id="block-warn" class="warn" hidden></p>
  </aside>
  <section id="canvas-wrap">
    <div id="canvas" tabindex="0" aria-label="流程图画布">
      <svg id="edges" xmlns="http://www.w3.org/2000/svg"><defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
        <marker id="arrow-sel" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
      </defs></svg>
      <div id="nodes"></div>
    </div>
  </section>
  <aside id="inspector">
    <h2>流程</h2>
    <div id="flow-fields"></div>
    <h2>选中</h2>
    <div id="selection"><p class="muted">点节点或连线编辑；拖块库到画布添加节点。</p></div>
  </aside>
</main>
<footer>
  <pre id="output" aria-live="polite">拖块库里的块到画布，或从「打开 YAML / 样例」开始。</pre>
</footer>
<script type="module" src="/ui/canvas.js"></script>
</body>
</html>
