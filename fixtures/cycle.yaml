# A3.3 fixture: a plain cycle (every node of the loop has a successor) that
# has a real exit c hanging off it, so E_CYCLE is the only root cause.
id: cycle-demo
version: 1
entry: a
nodes:
  - id: a
    uses: block:design@1
    with:
      request: "{{input.request}}"
  - id: b
    uses: block:design@1
    with:
      request: "{{input.request}}"
  - id: c
    uses: block:design@1
    with:
      request: "{{input.request}}"
edges:
  - from: a
    to: b
  - from: b
    to: a
  - from: b
    to: c
