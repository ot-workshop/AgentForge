# A3.3: the shape 员工三号's validator called an illegal jump (a back edge to a
# sibling branch). A back edge u -> v always has v reaching u, so v is an
# ancestor of u: E_ILLEGAL_JUMP has no P0 trigger source (v2.4 A12.4 [P0.5],
# 员工一号 57cfe581). The file stays as the P0.5 case; in P0 its code SET is
# {E_MISSING_EXIT, E_CYCLE}, which is what the tsv registers.
id: jump-demo
version: 1
entry: start
nodes:
  - id: start
    uses: block:test@1
    with:
      request: r
  - id: b
    uses: block:ops@1
  - id: c
    uses: block:ops@1
  - id: d
    uses: block:ops@1
edges:
  - from: start
    to: b
  - from: b
    to: c
  - from: c
    to: d
  - from: start
    to: c
  - from: d
    to: b
