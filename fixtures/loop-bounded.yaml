# #流水线:#10: a bounded retry loop that really runs. `verify --fail--> build`
# carries max_iterations: 2 and the fake runner fails the first runs
# (`FORGE_FAKE=retry-verify:2`), so the loop fires and the third verify passes.
id: loop-bounded
version: 1
entry: design
nodes:
  - id: design
    uses: block:design@1
    with:
      request: "{{input.request}}"
  - id: build
    uses: block:build@1
  - id: verify
    uses: block:verify@1
  - id: ops
    uses: block:ops@1
edges:
  - from: design
    to: build
  - from: build
    to: verify
  - id: verify-to-build
    from: verify
    to: build
    on:
      from: check.result
      status: fail
    max_iterations: 2
  - id: verify-to-ops
    from: verify
    to: ops
    on:
      from: check.result
      status: pass
